# MiGPT fork 私有版 — docker compose 示例
#
# 启动：docker compose pull && docker compose up -d
# 日志：docker compose logs -f mi-gpt
# 管理页：http://<宿主机IP>:8090
# 音乐服务：http://<宿主机IP>:58091
#
# 说明：
# - mi-gpt 容器启动后只跑 Web 管理页，不会自动登录小米（彻底告别启动即崩、重启刷接口）。
# - 在 Web 页填好配置，点「授权登录」才走小米登录；触发风控时验证链接直接显示在页面上点开即可。
# - conf 目录挂载到宿主机，config.json / cookies.json 持久化保存（cookies.json 丢了会重新触发验证码）。
# - songloft 是独立的音乐服务容器，通过 miot 插件接管小爱放歌；
#   两边各自轮询小爱的只读对话日志，互不抢消息。接入步骤见 docs/songloft-接入清单.md

services:
  mi-gpt:
    # CI（.github/workflows/docker.yml）构建好的镜像；想本地构建就换成 build: . 并自己打 tag
    image: ghcr.io/debbide/xiaoai:latest
    container_name: mi-gpt
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./conf:/app/conf
    environment:
      # 绕开宿主机代理：小米登录必须走家里直连 IP，否则触发异地风控
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=

  songloft:
    image: songloft/songloft:latest
    container_name: songloft
    restart: unless-stopped
    ports:
      # 58091 与 mi-gpt 的 8090 不冲突，宿主机上原样暴露即可
      - "58091:58091"
    volumes:
      - ./songloft/music:/app/music
      - ./songloft/data:/app/data
    environment:
      - ADMIN_USERNAME=admin
      # ⚠️ 改成你自己的强密码，别用这个
      - ADMIN_PASSWORD=change_me_please
      - LISTEN_PORT=58091
